# Administrator: insert INSIDE the existing HTTPS server block for
# xingban.xunlian.co. Do not replace the entire nginx.conf or other virtual hosts.
# First start the scoped community service at 127.0.0.1:8790 as documented.
location ~ ^/api/community(?:/|$) {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 65s;
    client_max_body_size 13m;
}
